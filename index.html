<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STEKO — Legal</title>
<style>
  :root { --bg:#0B0D11; --surface:#151821; --text:#E8EAF0; --muted:#8B92A5; --accent:#5B8DEF; --border:#232838; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.7; padding:0 20px 60px; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  .wrap { max-width:560px; width:100%; }
  header { text-align:center; padding:64px 0 40px; }
  h1 { font-size:2rem; font-weight:700; letter-spacing:-0.02em; }
  h1 .brand { color:var(--accent); }
  .subtitle { color:var(--muted); font-size:1rem; margin-top:12px; }
  .docs { margin-top:32px; display:flex; flex-direction:column; gap:12px; }
  .doc-link { display:block; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px 24px; text-decoration:none; transition:border-color 0.2s; }
  .doc-link:hover { border-color:var(--accent); }
  .doc-title { color:var(--text); font-size:1.05rem; font-weight:600; }
  footer { margin-top:48px; color:var(--muted); font-size:0.82rem; text-align:center; }
  a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1><span class="brand">STEKO</span></h1>
  <div class="subtitle">Legal</div>
</header>

<div class="docs">
  <a class="doc-link" href="privacy.html">
    <div class="doc-title">Privacy Policy</div>
  </a>
  <a class="doc-link" href="terms.html">
    <div class="doc-title">Terms of Service</div>
  </a>
  <a class="doc-link" href="delete-account.html">
    <div class="doc-title">Reset All Data</div>
  </a>
</div>

<footer>
  Go Steko LLC &middot; <a href="mailto:cheyton@gosteko.com">cheyton@gosteko.com</a>
</footer>
</div>
</body>
</html>
